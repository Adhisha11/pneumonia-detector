<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pneumonia Detection AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1193d4",
            "background-light": "#f6f7f8",
            "background-dark": "#101c22",
            "text-light": "#111618",
            "text-dark": "#f6f7f8"
          },
          fontFamily: {
            display: ["Inter"]
          },
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark min-h-screen h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full border-b border-primary/20 flex-shrink-0">
    <div class="mx-auto px-6 py-4 flex items-center justify-between max-w-screen-xl">
      <div class="flex items-center gap-3">
        <svg class="h-8 w-8 text-primary" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" fill-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM11 17V15H13V17H11ZM11 7V13H13V7H11Z"/></svg>
        <h1 class="text-xl font-bold tracking-tight select-none">Pneumonia Detection AI</h1>
      </div>
      <a href="index.html" class="hidden md:inline-flex items-center justify-center px-4 py-2 text-sm font-bold text-white bg-primary rounded-lg hover:bg-opacity-90 transition-colors shadow-lg">
        Get Started
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center max-h-full">
    <div class="grid grid-cols-2 gap-10 items-center w-full max-w-screen-xl h-[calc(100vh-96px)]">
      <!-- Left: X-ray Image or Placeholder -->
      <div class="h-full flex items-center justify-center">
        <div class="rounded-xl shadow-2xl border border-primary/20 bg-cover bg-center w-[430px] h-[430px] flex-shrink-0 overflow-hidden">
          <img id="xray-image"
               src="pneumo.jpg.jpg"
               alt="Chest X-ray"
               class="w-full h-full object-cover rounded-xl" />
        </div>
      </div>

      <!-- Right: Prediction and Details -->
      <div class="flex flex-col justify-center h-full px-8 gap-6 text-center md:text-left">
        <h2 class="text-4xl font-black leading-tight tracking-tighter text-primary mb-2">Diagnosis Result</h2>
        <p id="predicted-class" class="text-2xl font-semibold text-text-light dark:text-text-dark"></p>
        <p id="diagnosis-message" class="text-base md:text-lg text-text-light/80 dark:text-text-dark/80 italic leading-relaxed"></p>
        <button id="new-analysis-btn" aria-label="Run another pneumonia analysis"
          class="mt-10 inline-flex justify-center px-8 py-4 bg-primary text-white font-bold text-lg rounded-xl hover:bg-opacity-90 transition focus:outline-none focus:ring-4 focus:ring-primary/50 shadow-lg w-full md:w-auto">
          Run Another Analysis
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 border-t border-primary/20 text-center text-sm text-text-light/60 dark:text-text-dark/60 flex-shrink-0">
    <div class="mx-auto w-full max-w-screen-xl px-4">
      <p>© 2024 Pneumonia Detection AI. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const elements = {
        predictedClass: document.getElementById("predicted-class"),
        diagnosisMessage: document.getElementById("diagnosis-message"),
        xrayImage: document.getElementById("xray-image"),
        newAnalysisBtn: document.getElementById("new-analysis-btn"),
      };

      const messages = {
        "Normal": "No signs of pneumonia detected. Keep up your healthy habits.",
        "Bacterial Pneumonia": "High likelihood of bacterial pneumonia. Please consult a healthcare professional without delay.",
        "Viral Pneumonia": "Signs indicate viral pneumonia. Monitor symptoms carefully and seek medical advice.",
        "Fungal Pneumonia": "Fungal pneumonia suspected. Immediate medical consultation is advised.",
        "COVID-19 Pneumonia": "Possible COVID-19 related pneumonia. Isolate yourself and consult a healthcare provider urgently.",
        "default": "Detailed diagnosis information not available. Consult a healthcare professional for further interpretation.",
      };

      const colorMap = {
        bacterial: ["text-red-700"],
        viral: ["text-yellow-600"],
        covid: ["text-purple-700"],
        fungal: ["text-indigo-700"],
        normal: ["text-green-700"],
      };

      function getClassColor(prediction) {
        if (!prediction) return colorMap.normal;
        const predLower = prediction.toLowerCase();
        if (predLower.includes("bacterial")) return colorMap.bacterial;
        if (predLower.includes("viral")) return colorMap.viral;
        if (predLower.includes("covid")) return colorMap.covid;
        if (predLower.includes("fungal")) return colorMap.fungal;
        return colorMap.normal;
      }

      const resultData = localStorage.getItem("diagnosis");
      if (!resultData) {
        elements.predictedClass.textContent = "No prediction found!";
        elements.xrayImage.src = "pneumo.jpg.jpg";
        elements.diagnosisMessage.textContent = messages.default;
        return;
      }

      const data = JSON.parse(resultData);
      elements.predictedClass.textContent = `Predicted Class: ${data.predicted_class || "Unknown"}`;
      const defaultXrayUrl = "pneumo.jpg.jpg";
      const imageUrl = data.image || defaultXrayUrl;
      elements.xrayImage.src = imageUrl;
      elements.diagnosisMessage.textContent = messages[data.predicted_class] || messages.default;
      const colorClasses = getClassColor(data.predicted_class);
      elements.predictedClass.classList.value = `text-2xl font-semibold tracking-tighter ${colorClasses[0]}`;
      elements.newAnalysisBtn.addEventListener("click", () => {
        window.location.href = "upload.html";
      });
    });
  </script>
</body>
</html>
